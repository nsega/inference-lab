# Three simulated vLLM backends (llm-d-inference-sim).
# Separate single-replica Deployments (not one 3-replica Deployment) so fault
# injection can target an individual backend.
# All pods share app=vllm-sim, which is the EPP endpoint selector.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-0
  namespace: inference-lab
  labels: {app: vllm-sim, backend: b0}
spec:
  replicas: 1
  selector:
    matchLabels: {app: vllm-sim, backend: b0}
  template:
    metadata:
      labels: {app: vllm-sim, backend: b0}
    spec:
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.9.2
          imagePullPolicy: IfNotPresent
          args:
            - --port=8000
            - --model=meta-llama/Llama-3.1-8B-Instruct
            - --mode=echo
            - --force-dummy-tokenizer
            - --enable-kvcache
            - --kv-cache-size=256
            - --max-num-seqs=8
            - --prefill-time-per-token=2ms
            - --inter-token-latency=25ms
            - --inter-token-latency-std-dev=5ms
            - --max-model-len=4096
            - --seed=100
          env:
            - name: POD_IP
              valueFrom: {fieldRef: {fieldPath: status.podIP}}
          ports:
            - {containerPort: 8000, name: http}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            periodSeconds: 2
---
