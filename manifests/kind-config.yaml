kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: inference-lab
nodes:
  - role: control-plane
    extraPortMappings:
      # gateway (Envoy) NodePort -> host
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      # Prometheus NodePort -> host
      - containerPort: 30090
        hostPort: 30090
        protocol: TCP
