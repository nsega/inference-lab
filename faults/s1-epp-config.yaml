# FAULT S1 — scorer-weight misconfig.
# The queue-depth scorer weight is INVERTED (negative) and the kv-cache scorer
# zeroed: the scheduler now prefers the most-loaded backend, a positive
# feedback loop that piles the queue onto one backend while the others idle.
apiVersion: inference.networking.x-k8s.io/v1alpha1
kind: EndpointPickerConfig
plugins:
  - type: queue-scorer
  - type: kv-cache-utilization-scorer
  - type: prefix-cache-scorer
    parameters:
      maxPrefixBlocksToMatch: 256
      lruCapacityPerServer: 31250
  - type: max-score-picker
  - type: single-profile-handler
  - type: metrics-data-source
    parameters:
      scheme: "http"
      path: "/metrics"
      insecureSkipVerify: true
  - type: core-metrics-extractor
schedulingProfiles:
  - name: default
    plugins:
      - pluginRef: queue-scorer
        weight: -2
      - pluginRef: kv-cache-utilization-scorer
        weight: 0
      - pluginRef: prefix-cache-scorer
        weight: 3
      - pluginRef: max-score-picker
dataLayer:
  sources:
    - pluginRef: metrics-data-source
      extractors:
        - pluginRef: core-metrics-extractor
